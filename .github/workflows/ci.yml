name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!e2e' --filter '!scripts'
      - run: pnpm --recursive --filter '!e2e' --filter '!scripts' typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Engine build stays under 17 kB gzipped
        run: test "$(gzip -c packages/hyperselect/dist/index.js | wc -c)" -lt 17000

